<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Recommender</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px 120px;
      background: #0f0f12;
      color: #e8e8ea;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 600; }
    .sub { color: #8a8a92; font-size: 0.85rem; margin-bottom: 24px; }

    #thread {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 90%;
      word-wrap: break-word;
    }
    .user {
      background: #2a4a7f;
      align-self: flex-end;
    }
    .assistant {
      background: #1c1c22;
      align-self: flex-start;
      width: 100%;
    }
    .assistant.chat-only {
      background: #1c1c22;
      padding: 12px 16px;
    }
    .meta {
      font-size: 0.75rem;
      color: #6a6a72;
      margin-top: 6px;
    }

    .rec {
      border-top: 1px solid #2a2a32;
      padding: 12px 0;
    }
    .rec:first-of-type { border-top: none; padding-top: 4px; }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .title { font-weight: 600; color: #f4f4f6; }
    .score {
      font-size: 0.75rem;
      color: #8a8a92;
      background: #26262e;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .sub-info {
      color: #8a8a92;
      font-size: 0.8rem;
      margin: 2px 0 6px;
    }
    .explanation { color: #d0d0d4; font-size: 0.92rem; }

    #form {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0f0f12;
      border-top: 1px solid #2a2a32;
      padding: 16px;
    }
    .form-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    #q {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #2a2a32;
      border-radius: 10px;
      background: #18181e;
      color: #e8e8ea;
      font-size: 0.95rem;
      font-family: inherit;
    }
    #q:focus {
      outline: none;
      border-color: #4a7ac8;
    }
    #submit {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4a7ac8;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #submit:hover { background: #5a8ad8; }
    #submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .pending {
      color: #8a8a92;
      font-style: italic;
      padding: 12px 16px;
    }
    .error {
      background: #4a2020;
      color: #ffb0b0;
      padding: 12px 16px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Movie Recommender</h1>
  <div class="sub">Describe what you're in the mood for — vibe, era, genre, or a reference title.</div>

  <!-- Element 1: results area (conversation thread) -->
  <div id="thread"></div>

  <!-- Elements 2 & 3: text input + submit button, fixed at bottom -->
  <div id="form">
    <div class="form-inner">
      <input id="q" type="text"
             placeholder="e.g. a cerebral sci-fi thriller like Inception, but less confusing"
             autocomplete="off" />
      <button id="submit">Send</button>
    </div>
  </div>

  <script>
    // One session id per page load — new tab == new conversation
    const sessionId = crypto.randomUUID();

    const $thread = document.getElementById("thread");
    const $input = document.getElementById("q");
    const $submit = document.getElementById("submit");

    function addUserBubble(text) {
      const el = document.createElement("div");
      el.className = "bubble user";
      el.textContent = text;
      $thread.appendChild(el);
    }

    function addPending() {
      const el = document.createElement("div");
      el.className = "pending";
      el.textContent = "Thinking…";
      el.id = "pending";
      $thread.appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function removePending() {
      const el = document.getElementById("pending");
      if (el) el.remove();
    }

    function addAssistantResults(data) {
      const el = document.createElement("div");
      el.className = "bubble assistant";

      if (data.chat_answer) {
        el.classList.add("chat-only");
        el.textContent = data.chat_answer;
      } else if (data.results && data.results.length > 0) {
        for (const [i, r] of data.results.entries()) {
          const row = document.createElement("div");
          row.className = "rec";
          row.innerHTML = `
            <div class="title-row">
              <span class="title">${i + 1}. ${escape(r.title)}</span>
              <span class="score">${r.score}</span>
            </div>
            <div class="sub-info">${escape(r.type)} · ${r.release_year ?? "—"} · ${escape((r.genres || []).join(", "))}</div>
            <div class="explanation">${escape(r.explanation)}</div>
          `;
          el.appendChild(row);
        }
      } else {
        el.textContent = "No results. Try rephrasing your request.";
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const intent = data.parsed_query ? data.parsed_query.intent : "?";
      meta.textContent = `intent: ${intent} · ${data.latency_ms} ms`;
      el.appendChild(meta);

      $thread.appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function addError(msg) {
      const el = document.createElement("div");
      el.className = "error";
      el.textContent = msg;
      $thread.appendChild(el);
    }

    function escape(s) {
      if (s == null) return "";
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function sendQuery() {
      const query = $input.value.trim();
      if (!query) return;

      $input.value = "";
      $submit.disabled = true;
      addUserBubble(query);
      addPending();

      try {
        const resp = await fetch("/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, query }),
        });
        removePending();
        if (!resp.ok) {
          addError(`Request failed (${resp.status})`);
          return;
        }
        const data = await resp.json();
        addAssistantResults(data);
      } catch (err) {
        removePending();
        addError(`Network error: ${err.message}`);
      } finally {
        $submit.disabled = false;
        $input.focus();
      }
    }

    $submit.addEventListener("click", sendQuery);
    $input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
      }
    });
    $input.focus();
  </script>
</body>
</html>
